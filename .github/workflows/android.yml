# Builds the BioRadio Android app (APK) on GitHub's servers and publishes it on the Releases page.
# The latest APK is always at:
#   https://github.com/odhiambokelly/BioRadio/releases/latest/download/BioRadio.apk
#
# Signing: if the repository secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD are set,
# they are used. Otherwise a key is created on the first run and saved in android/app/release.keystore
# so later builds can update the app. That key is public; switch to the secrets before a Play Store release.
name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "Using signing key from repository secrets"
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          else
            KS=android/app/release.keystore
            if [ ! -f "$KS" ]; then
              echo "Creating a signing key (first build)"
              keytool -genkeypair -keystore "$KS" -alias bioradio -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass bioradio-public -keypass bioradio-public -dname "CN=BioRadio, O=BioRadio"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add "$KS"
              git commit -m "Add APK signing key [skip ci]"
              git push
            fi
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/$KS" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=bioradio-public" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleRelease -PversionCode=${{ github.run_number }}

      - name: Show signing fingerprint (for assetlinks.json)
        run: keytool -list -v -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias bioradio | grep -E "SHA256:"

      - name: Collect APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk BioRadio.apk
          ls -l BioRadio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BioRadio-apk
          path: BioRadio.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-1.0.${{ github.run_number }}
          name: BioRadio for Android 1.0.${{ github.run_number }}
          body: |
            BioRadio Android app. Download **BioRadio.apk** below, open it on your phone and allow installing from your browser if Android asks.
            Needs Android 5.0 or newer. Works best with Google Chrome installed.
          files: BioRadio.apk
          make_latest: true
